name: CI
# The name is load-bearing: deploy.yml fires on `workflow_run` of the workflow
# named `CI`, and deploys only when its conclusion is `success`. Every job below
# counts toward that conclusion -- one failed shard fails the whole workflow.

# Pushes to main, and every pull request. A feature branch without a PR is not
# tested -- open the PR early if you want the signal.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run it superseded. This repository
# is private, so Actions minutes are billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shape: typecheck+lint, eight test shards and the build all start at once; a
# last job waits for all of them and decides the result. Until 2026-09-25 this
# was one job running typecheck, lint and the whole suite in a row: about 25
# minutes (run 36071133680, Test 1421s), then about 10 once #21 pooled PGlite
# per worker (run 36115059878, Test 512s), then 3m46s at four shards (run
# 36131956671).

jobs:
  checks:
    name: typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  test:
    name: test ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # A shard's tests take about a minute. A timeout kills the job before the
    # report is written, which the verdict job below then reports as a shard
    # that left no report.
    timeout-minutes: 10

    strategy:
      # Let every shard finish. A failure in one must not cancel the others and
      # hide their failures behind it.
      fail-fast: false
      matrix:
        # vitest splits by FILE COUNT over a hash of each path, not by duration,
        # so shards are uneven. At four shards the Test step took 106-131s
        # (run 36131956671) and set a 3m46s run. Modelled from that run's
        # per-file times, the heaviest of eight shards is ~66s of tests --
        # what the two-minute target needs. The count comes from this list via
        # strategy.job-total, so adding a shard is one edit.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      # src/db/index.ts reads DATABASE_URL at import time. The suite never talks
      # to this address -- tests use an in-process PGlite from src/test/db.ts --
      # but a bare runner would throw on import without it.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-not-a-real-secret
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: ./.uploads
      REPORT: vitest-report-${{ matrix.shard }}-of-${{ strategy.job-total }}.json

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install

      # Every flag is load-bearing; CLAUDE.md explains why. Two differences from
      # the local command, both deliberate:
      #   --maxWorkers=2, not 4 -- a standard runner is 2-core/7GB, and four
      #     in-process Postgres instances on it is the contention that fabricates
      #     ~110 beforeEach timeouts.
      #   the --outputFile is unique per shard rather than per process -- each
      #     shard is its own runner, and the verdict job needs the reports apart.
      # Never drop --reporter=default: --reporter=json alone REPLACES it, and the
      # run loses the Unhandled Errors block where a SIGKILLed worker shows up.
      - name: Test
        run: |
          npx vitest run \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --maxWorkers=2 \
            --hookTimeout 60000 \
            --testTimeout 60000 \
            --reporter=default \
            --reporter=json \
            --outputFile "$REPORT" || VITEST_EXIT=$?
          echo "vitest exited ${VITEST_EXIT:-0}"
          node scripts/verify-test-report.mjs "$REPORT" "${VITEST_EXIT:-0}"

      # Always, not only on failure: the verdict job reads every shard's report,
      # and a missing one is exactly what it exists to catch.
      - name: Hand the report to the verdict job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: ${{ env.REPORT }}
          if-no-files-found: warn
          retention-days: 14

  # `next build` had never run outside a developer's Mac. Two failure modes it
  # is here to catch, both of which pass every other check in this workflow:
  #   argon2 is a native module (node-gyp-build + a prebuilds/ tree). A bundle
  #     built on Apple silicon carries darwin-arm64 and 500s every sign-in on
  #     Vercel's Linux runtime, with a green build.
  #   the output-file tracer resolves differently on a case-sensitive
  #     filesystem, and next.config.ts leans on it to keep
  #     docs/reference-data/ out of every traced route.
  # It does not deploy. Deployment is .github/workflows/deploy.yml, which
  # builds its own copy through `vercel build`.
  #
  # Deliberately a plain `npm ci`, not the cached node_modules the other jobs
  # restore: this is the job that proves argon2 loads on linux/Node 22, so it
  # installs the way deploy.yml does. It is not on the critical path.
  build:
    name: next build (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Same reason as the test job: src/db/index.ts reads DATABASE_URL at
      # import time and every route reaches it through src/lib/auth/config.ts,
      # so the build needs the variable to exist. Nothing connects to it --
      # every admin page is dynamic behind requireAdmin().
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-not-a-real-secret
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: ./.uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npx next build

      - name: Prove the real workbooks are not in the build output
        # next.config.ts excludes docs/reference-data/ from every traced route
        # via the global '/*' key. This asserts the exclusion actually held.
        #
        # Checking file PATHS alone would be an instrument that always agrees:
        # a non-standalone `next build` never copies traced files into .next,
        # it only LISTS them in .nft.json trace manifests. So a path check
        # passes even with outputFileTracingExcludes deleted outright. The
        # manifests' contents are the oracle that can actually fail.
        run: |
          set -euo pipefail

          manifests=$(find .next -name '*.nft.json' | wc -l | tr -d ' ')
          echo "trace manifests found: $manifests"
          if [ "$manifests" -eq 0 ]; then
            echo "no .nft.json manifests — this check cannot prove anything."
            echo "Find what this Next version names its trace files before trusting a green result."
            exit 1
          fi

          if grep -rl 'reference-data' $(find .next -name '*.nft.json') 2>/dev/null | head -1 | grep -q .; then
            echo "docs/reference-data/ is listed in a trace manifest — it would ship in a function bundle"
            grep -rl 'reference-data' $(find .next -name '*.nft.json') | head -5
            exit 1
          fi
          echo "no reference-data in any trace manifest"

          # Belt and braces: no copied file either.
          if find .next -path '*reference-data*' -print -quit | grep -q .; then
            echo "a reference-data path exists under .next"
            exit 1
          fi
          echo "no reference-data paths under .next"

  # The one job that answers "did CI pass". Each shard checks its own report,
  # but no shard can see a shard that is missing: a matrix job that never ran,
  # or died before writing, leaves every report that DID arrive clean. So this
  # job takes the expected test files from git, not from the reports, and
  # requires the reports to cover them exactly once. It also re-reads every
  # other job's result, so a red anything is a red verdict here too.
  #
  # `!cancelled()` rather than `always()`: it must run when a shard failed
  # (that is when it matters), but not spin up for a run a newer push replaced.
  verdict:
    name: verdict · every shard accounted for
    needs: [checks, test, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # git ls-files needs the tree; the script needs only fs, path and
      # child_process, so the runner's own Node is enough -- no setup-node here,
      # because this job is on the critical path.
      - uses: actions/checkout@v4

      - name: Collect the shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-*
          path: shard-reports
          merge-multiple: true

      - name: Every test file ran exactly once, and passed
        run: |
          echo "runner node $(node --version)"
          node scripts/verify-shard-reports.mjs shard-reports

      - name: Every other job passed
        if: ${{ !cancelled() }}
        run: |
          echo "typecheck · lint: ${{ needs.checks.result }}"
          echo "test shards:      ${{ needs.test.result }}"
          echo "next build:       ${{ needs.build.result }}"
          [ "${{ needs.checks.result }}" = success ] &&
            [ "${{ needs.test.result }}" = success ] &&
            [ "${{ needs.build.result }}" = success ]
