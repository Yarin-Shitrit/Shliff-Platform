<!--meta {"file":"MobilePay.dc.html","w":390,"h":844,"nav":"","title":"מובייל — רישום תשלום","interactive":false} -->
<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--HEAD-->
<div class="app {{themeClass}}" dir="rtl" style="width: __W__px; height: __H__px;">
  <div style="flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--canvas);">

    <header style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border-bottom: 1px solid var(--line);">
      <a class="btn ghost icon" href="MobileHome.dc.html" aria-label="חזרה" style="width: 44px; height: 44px;">[[i:right:20]]</a>
      <span style="font-size: 17px; font-weight: 600;">רישום תשלום</span>
      <a class="btn ghost icon" href="MobileHome.dc.html" aria-label="סגירה" style="margin-inline-start: auto; width: 44px; height: 44px;">[[i:x:20]]</a>
    </header>

    <div style="flex: 1; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 14px;">

      <section class="card" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px;">
        <span class="av lg c2">אכ</span>
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 17px; font-weight: 600;">איתי כהן</span>
          <span class="muted" style="display: block; font-size: 13px;">תעריף רגיל · נותר <bdi>1,200 ₪</bdi></span>
        </span>
        <button class="btn sm" type="button">החלפה</button>
      </section>

      <div class="field">
        <span class="flabel">סכום</span>
        <div style="height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--focus); border-radius: 12px; box-shadow: 0 0 0 3px rgba(200,87,15,.20); background: var(--panel);">
          <bdi style="font-size: 30px; font-weight: 600;">1,200</bdi>
          <span class="muted" style="margin-inline-start: auto; font-size: 20px;">₪</span>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 2px;">
          <button class="chip on" type="button" style="height: 36px;">מלא <b><bdi>1,200</bdi></b></button>
          <button class="chip" type="button" style="height: 36px;">חצי <bdi>600</bdi></button>
          <button class="chip" type="button" style="height: 36px;">סכום אחר</button>
        </div>
      </div>

      <div class="field">
        <span class="flabel">אמצעי תשלום</span>
        <div class="seg" style="display: flex; flex-wrap: wrap;">
          <button type="button" aria-pressed="true" style="height: 44px; flex: 1 0 28%;">[[i:cash:15]] מזומן</button>
          <button type="button" style="height: 44px; flex: 1 0 28%;">ביט</button>
          <button type="button" style="height: 44px; flex: 1 0 28%;">פייבוקס</button>
          <button type="button" style="height: 44px; flex: 1 0 28%;">העברה</button>
          <button type="button" style="height: 44px; flex: 1 0 28%;">אשראי</button>
          <button type="button" style="height: 44px; flex: 1 0 28%;">קיזוז</button>
        </div>
      </div>

      <div class="field">
        <span class="flabel">לאיזו קופה נכנס</span>
        <button class="input" type="button" style="height: 48px; font-size: 16px;">
          [[i:bank:16]] קופה מזומן
          <span style="margin-inline-start: auto; display: inline-flex; color: var(--ink-3);">[[i:down:16]]</span>
        </button>
        <span class="hint">בלי קופה הסכום ייספר בגבייה אבל לא ביתרה של אף חשבון.</span>
      </div>

      <div class="field">
        <span class="flabel">תאריך</span>
        <button class="input" type="button" style="height: 48px; font-size: 16px;">
          [[i:calendar:16]] <bdi>17/09/26</bdi>
          <span style="margin-inline-start: auto; display: inline-flex; color: var(--ink-3);">[[i:down:16]]</span>
        </button>
        <span class="hint">היום</span>
      </div>

      <div class="field">
        <span class="flabel">הערה</span>
        <button class="input" type="button" style="height: 48px; font-size: 16px;">
          <span class="muted">לא חובה</span>
          <span style="margin-inline-start: auto; display: inline-flex; color: var(--ink-3);">[[i:pencil:16]]</span>
        </button>
      </div>

    </div>

    <div style="margin-top: auto; padding: 12px 14px 16px; border-top: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 8px;">
      <button class="btn primary" type="button" style="width: 100%; height: 50px; font-size: 16px;">רישום <bdi>1,200 ₪</bdi></button>
      <button class="btn" type="button" style="width: 100%; height: 44px; font-size: 15px;">שמירה ומעבר לחבר הבא</button>
      <span class="muted" style="text-align: center; font-size: 12px;">יירשם על שמך · שירה</span>
    </div>

  </div>
<!--OVERLAYS-->
</div>
</x-dc>
<script data-dc-script data-props='__PROPS__'>
class Component extends DCLogic {
/*SHELL*/
  renderVals() {
    return { ...this.shell() };
  }
}
</script>
</body>
</html>
